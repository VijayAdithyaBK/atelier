  <!-- Floating Linear Plinth / Display Shelf Beam -->
  <line x1="13" y1="46" x2="51" y2="46" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" />

  <!-- Curated Iconic Artifact Sphere (Gold Accent) -->
