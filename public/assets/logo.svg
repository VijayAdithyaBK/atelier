  <rect width="64" height="64" rx="15" fill="#0D0D0E" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Architectural Vault / Niche Arch (Bold, razor-sharp at 16px) -->
  <path d="M20 46V28C20 21.3726 25.3726 16 32 16C38.6274 16 44 21.3726 44 28V46" 
        fill="none" 
